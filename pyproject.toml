[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consensus-lab"
version = "0.1.0"
description = "A deterministic Raft-style consensus simulator for distributed systems coursework."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "N0rd9" }]
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
consensus-lab = "consensus_lab.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
